services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kgs-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FRONTEND_URL=http://72.62.52.120
      - DATABASE_PATH=/app/data/kgs.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      - kgs-data:/app/data
    networks:
      - kgs-network

networks:
  kgs-network:
    driver: bridge

volumes:
  kgs-data:
    driver: local
