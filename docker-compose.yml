services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kgs-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - DATABASE_PATH=/app/data/kgs.db
    volumes:
      - kgs-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kgs-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: kgs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - kgs-network
    profiles:
      - with-nginx

volumes:
  kgs-data:
    driver: local

networks:
  kgs-network:
    driver: bridge
